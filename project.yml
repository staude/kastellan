name: Kastellan
options:
  bundleIdPrefix: net.staude
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: de
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: "7N2W4T6UPV"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
packages:
  KastellanCore:
    path: Packages/KastellanCore
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: "0.11.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.2"
targets:
  kastellan-mcp:
    type: tool
    platform: macOS
    sources:
      - path: kastellan-mcp
    dependencies:
      - package: KastellanCore
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_NAME: kastellan-mcp
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.kastellan.mcp
        CODE_SIGN_ENTITLEMENTS: kastellan-mcp/kastellan-mcp.entitlements
        SKIP_INSTALL: YES
  Kastellan:
    type: application
    platform: macOS
    sources:
      - path: Kastellan
        excludes:
          - "**/.DS_Store"
    dependencies:
      - package: KastellanCore
      - package: Sparkle
        product: Sparkle
      - target: kastellan-mcp
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.kastellan
        INFOPLIST_FILE: Kastellan/Info.plist
        CODE_SIGN_ENTITLEMENTS: Kastellan/Kastellan.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES
  KastellanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: KastellanTests
    dependencies:
      - target: Kastellan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.staude.kastellan.tests
        INFOPLIST_FILE: KastellanTests/Info.plist
schemes:
  Kastellan:
    build:
      targets:
        Kastellan: all
        kastellan-mcp: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - KastellanTests
  kastellan-mcp:
    build:
      targets:
        kastellan-mcp: all
    run:
      config: Debug
